name: iOS unsigned test build

# Manual-only: builds an unsigned .ipa for free sideload testing
# (e.g. via Sideloadly) without needing a paid Apple Developer account.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Disable Swift Package Manager (avoid SPM/CocoaPods hybrid resolution bugs)
        run: flutter config --no-enable-swift-package-manager

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa_unsigned/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa_unsigned/Payload/
          cd build/ios/ipa_unsigned
          zip -r ../../../KivasFajo-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: KivasFajo-unsigned-ipa
          path: KivasFajo-unsigned.ipa
          retention-days: 14
